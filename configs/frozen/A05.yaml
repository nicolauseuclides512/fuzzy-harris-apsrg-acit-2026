project:
  name: enhanced_apsrg_stage3_isolated_ablation
  random_seed: 42
preprocessing:
  use_green_channel: true
  normalize_intensity: true
  apply_clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid_size:
  - 8
  - 8
  denoise_method: median
  median_kernel_size: 3
  apply_fov_mask: true
apsrg_baseline:
  vesselness_kernel_sizes:
  - 7
  - 11
  - 15
  seed_selection_method: selective_fuzzy_harris
  seed_percentile: 92
  candidate_percentile: 78
  region_growing_connectivity: 8
  region_growing_mode: edge_delayed
  max_vesselness_difference: 18
  max_iterations: 500000
  min_component_area: 8
  fill_small_holes_area: 8
  hybrid_seed:
    target_seed_count: 77
    min_seed_count: 7
    max_seed_count: 77
    seed_dilate_radius: 1
    min_seed_distance: 3
    fuzzy_weight: 0.35
    harris_weight: 0.4
    vesselness_weight: 0.25
  edge_delayed_region_growing:
    priority_mode: kang_product
    acceptance_mode: region_mean
    region_mean_tolerance_multiplier: 2.0
    region_mean_scope: connected_seed_component
    reconsider_rejected_candidates: true
    kang_minimum_edge_factor: 0.05
    hybrid_local_weight: 0.65
    hybrid_edge_weight: 0.35
